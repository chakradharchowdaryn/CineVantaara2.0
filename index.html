    <meta name="apple-mobile-web-app-title" content="CineVantaara" />
    <!-- OpenGraph & Social Indexing (Phase 14: Item 90) -->
    <meta property="og:title" content="CineVantaara — Where Stories Meet Talent" />
    <meta property="og:description" content="Discover movies, book premiere passes, and collaborate across 30 specialized film disciplines." />
    <meta property="og:type" content="website" />

    <!-- Google Fonts: Cinzel, Cinzel Decorative, Playfair Display, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Cinzel+Decorative:wght@700;900&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#070709] text-gray-100 antialiased selection:bg-amber-500/30 selection:text-amber-200 overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js?v=2.5').then((reg) => {
            console.log('CineVantaara PWA Service Worker Registered', reg.scope);
            reg.update();
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('New CineVantaara version installed! Refreshing...');
                    window.location.reload();
                  }
                });
              }
            });
          }).catch((err) => console.log('CineVantaara PWA Service Worker Registration Failed', err));
        });
      }
    </script>
  </body>
</html>
