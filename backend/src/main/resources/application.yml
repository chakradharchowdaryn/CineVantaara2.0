spring:
  application:
    name: cinevantaara-backend
  profiles:
    active: dev
  jackson:
    serialization:
      indent-output: true

server:
  port: 8080

# JWT Configuration
app:
  jwt:
    secret: "CineVantaaraUltraSecretKeyForHollywoodFilmIndustryCollaborationPlatform2026!"
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  ai-engine:
    url: "http://localhost:8000"

---
# Development Profile (Embedded H2 with PostgreSQL compatibility for zero-dependency local runs)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:cinevantaaradb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false

---
# Production Profile (Real PostgreSQL with Flyway Migrations)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cinevantaara}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
